<section class="volunteer-directory-admin">
  <p><a href="{{.Base}}">Back to directory</a></p>
  <h1 class="h3">Skills</h1>
  <p>Enter one skill per line. Saving replaces the checkbox list on the public form.</p>
  <form method="post" action="{{.Base}}/skills">
    {{.CSRFField}}
    <div class="mb-3">
      <label class="form-label" for="volunteer-skills">Skills</label>
      <textarea class="form-control" id="volunteer-skills" name="skills" rows="12">{{.Skills}}</textarea>
    </div>
    <button class="btn btn-primary" type="submit">Save skills</button>
  </form>
</section>
